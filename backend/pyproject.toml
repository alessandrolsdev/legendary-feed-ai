[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# As fixtures precisam definir variáveis de ambiente antes dos imports.
"tests/conftest.py" = ["E402"]
# `Depends(...)`/`File(...)` em argumentos padrão é o idioma do FastAPI.
"app/main.py" = ["B008"]
